<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | NEXUS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000810; color: #e2e8f0; font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .container { text-align: center; padding: 2rem; }
    .title { color: #00e5ff; font-size: 4rem; font-weight: bold; font-family: monospace; margin-bottom: 0.5rem; }
    .subtitle { color: rgba(0,229,255,0.4); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 2rem; }
    p { color: rgba(255,255,255,0.5); margin-bottom: 1.5rem; }
    button { background: transparent; border: 1px solid rgba(0,229,255,0.3); color: #00e5ff; padding: 0.5rem 1.5rem; border-radius: 0.5rem; cursor: pointer; font-size: 0.875rem; }
    button:hover { background: rgba(0,229,255,0.1); }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">OFFLINE</div>
    <div class="subtitle">NEXUS // No Signal</div>
    <p>You're offline. NEXUS will reconnect automatically when your network returns.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
